<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier une activité</title>
</head>
<body>

<h1>Modifier une activité</h1>

<form method="POST">

    <label>Titre</label><br>
    <input type="text"
           name="titre"
           value="{{ activite.titre }}"
           required>

    <br><br>

    <label>Description</label><br>

    <textarea
        name="description"
        rows="6"
        cols="60"
        required>{{ activite.description }}</textarea>

    <br><br>

    <button type="submit">
        Enregistrer
    </button>

</form>

<br>

<a href="{{ url_for('admin_activites') }}">
    Retour
</a>

</body>
</html>
